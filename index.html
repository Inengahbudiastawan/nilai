<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter Arcade - GitHub Pages</title>
    <style>
        body {
            margin: 0;
            background-color: #050510;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin: 5px 0;
            font-size: 24px;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
        }
        canvas {
            border: 4px solid #333;
            background: radial-gradient(circle, #111122 0%, #050510 100%);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
        }
        .instruksi {
            margin-top: 10px;
            color: #aaa;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>SPACE SHOOTER</h1>
    <canvas id="gameCanvas" width="480" height="600"></canvas>
    <div class="instruksi">
        Gunakan tombol <b>Panah Kiri / Kanan</b> untuk bergerak.<br>
        Tekan tombol <b>Spasi (Spacebar)</b> untuk menembak.
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Status Game
        let skor = 0;
        let nyawa = 100; // Fitur Baru: Nyawa Pemain (Persentase)
        let gameOver = false;

        // Kontrol Keyboard
        let tombol = {};
        document.addEventListener("keydown", (e) => tombol[e.key] = true);
        document.addEventListener("keyup", (e) => tombol[e.key] = false);

        // Objek Pesawat Pemain
        const pemain = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 60,
            lebar: 40,
            tinggi: 30,
            kecepatan: 6,
            warna: "#00ffcc",
            gambar() {
                ctx.fillStyle = this.warna;
                // Menggambar pesawat tempur bentuk segitiga
                ctx.beginPath();
                ctx.moveTo(this.x + this.lebar / 2, this.y);
                ctx.lineTo(this.x, this.y + this.tinggi);
                ctx.lineTo(this.x + this.lebar, this.y + this.tinggi);
                ctx.closePath();
                ctx.fill();
                
                // Efek mesin roket belakang
                ctx.fillStyle = "#ff3300";
                ctx.fillRect(this.x + this.lebar/2 - 4, this.y + this.tinggi, 8, 5);
            }
        };

        // Wadah List Tembakan & Musuh
        let listTembakan = [];
        let listMusuh = [];
        let delayTembak = 0;

        // Fungsi Membuat Musuh Baru
        function munculkanMusuh() {
            // Tingkat kemunculan musuh diatur konstan agar seimbang
            if (Math.random() < 0.03 && listMusuh.length < 8) {
                let ukuran = Math.random() * 20 + 20; // Ukuran acak antara 20-40
                
                // Fitur Baru: Musuh bertambah cepat seiring skor meningkat
                let bonusKecepatan = skor / 100; 
                
                listMusuh.push({
                    x: Math.random() * (canvas.width - ukuran),
                    y: -ukuran,
                    lebar: ukuran,
                    tinggi: ukuran,
                    kecepatan: (Math.random() * 2 + 1.5) + bonusKecepatan,
                    warna: `hsl(${Math.random() * 360}, 100%, 50%)`
                });
            }
        }

        // Deteksi Tabrakan (Collision Detection)
        function apakahTabrakan(obj1, obj2) {
            return obj1.x < obj2.x + obj2.lebar &&
                   obj1.x + obj1.lebar > obj2.x &&
                   obj1.y < obj2.y + obj2.tinggi &&
                   obj1.y + obj1.tinggi > obj2.y;
        }

        // Loop Utama Game (Berjalan terus menerus)
        function updateGame() {
            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "#ff3333";
                ctx.font = "bold 36px Courier New";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
                
                ctx.fillStyle = "white";
                ctx.font = "18px Courier New";
                ctx.fillText(`Skor Akhir Anda: ${skor}`, canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillText("Muat Ulang Halaman (F5) untuk Main Lagi", canvas.width / 2, canvas.height / 2 + 60);
                return;
            }

            // 1. Bersihkan Layar
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 2. Gambar & Gerakkan Pesawat Pemain
            if (tombol["ArrowLeft"] && pemain.x > 0) pemain.x -= pemain.kecepatan;
            if (tombol["ArrowRight"] && pemain.x < canvas.width - pemain.lebar) pemain.x += pemain.kecepatan;
            pemain.gambar();

            // 3. Mekanisme Menembak (Spasi)
            if (delayTembak > 0) delayTembak--;
            if (tombol[" "] && delayTembak === 0) {
                listTembakan.push({
                    x: pemain.x + pemain.lebar / 2 - 2,
                    y: pemain.y,
                    lebar: 4,
                    tinggi: 15,
                    kecepatan: 8
                });
                delayTembak = 12; // Jeda waktu jeda tembak
            }

            // 4. Update Posisi Tembakan
            for (let i = listTembakan.length - 1; i >= 0; i--) {
                let t = listTembakan[i];
                t.y -= t.kecepatan;
                
                // Gambar Tembakan Laser
                ctx.fillStyle = "#ffff00";
                ctx.fillRect(t.x, t.y, t.lebar, t.tinggi);

                // Hapus jika keluar layar atas
                if (t.y < 0) listTembakan.splice(i, 1);
            }

            // 5. Update Posisi Musuh & Cek Tabrakan
            munculkanMusuh();
            for (let i = listMusuh.length - 1; i >= 0; i--) {
                let m = listMusuh[i];
                m.y += m.kecepatan;

                // Gambar Musuh berbentuk meteor/kotak
                ctx.fillStyle = m.warna;
                ctx.fillRect(m.x, m.y, m.lebar, m.tinggi);

                // Cek jika musuh menabrak pemain
                if (apakahTabrakan(m, pemain)) {
                    listMusuh.splice(i, 1);
                    nyawa -= 25; // Mengurangi nyawa jika tertabrak
                    if (nyawa <= 0) {
                        nyawa = 0;
                        gameOver = true;
                    }
                    continue;
                }

                // Cek jika musuh hancur tertembak laser
                for (let j = listTembakan.length - 1; j >= 0; j--) {
                    let t = listTembakan[j];
                    if (apakahTabrakan(t, m)) {
                        listMusuh.splice(i, 1);
                        listTembakan.splice(j, 1);
                        skor += 10;
                        break;
                    }
                }

                // Hapus jika musuh lolos ke batas bawah layar
                if (m.y > canvas.height) {
                    listMusuh.splice(i, 1);
                    skor -= 5; // Hukuman skor berkurang
                }
            }

            // 6. UI: Tampilkan Skor di Layar atas
            ctx.fillStyle = "white";
            ctx.font = "20px Courier New";
            ctx.textAlign = "left";
            ctx.fillText(`Skor: ${skor}`, 15, 30);

            // UI: Bar Indikator Nyawa Pemain
            ctx.fillStyle = "#333";
            ctx.fillRect(15, 45, 120, 12); // Background Bar abu-abu
            ctx.fillStyle = nyawa > 40 ? "#00ff33" : "#ff3333"; // Berubah merah jika kritis
            ctx.fillRect(15, 45, (nyawa / 100) * 120, 12); // Isian Bar Nyawa

            // Jalankan loop animasi secara stabil
            requestAnimationFrame(updateGame);
        }

        // Mulai Game otomatis saat dibuka
        updateGame();
    </script>
</body>
</html>

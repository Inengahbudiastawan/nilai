<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avatar Resepsionis AI</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1e1b4b, #090d16 70%);
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .app {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 22px;
    }
    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; }
    }
    .panel {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    video {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 16px;
      background: #020617;
      transform: scaleX(-1);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    #cameraStatus {
      font-size: 14px;
      color: #cbd5e1;
      text-align: center;
      min-height: 20px;
    }
    button {
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: #fff;
      border: none;
      padding: 12px 22px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.4px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 24px rgba(236, 72, 153, 0.35);
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(139, 92, 246, 0.45);
    }
    .avatar-stage {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: linear-gradient(160deg, #fbcfe8, #f472b6 55%, #c084fc);
      padding: 6px;
      box-shadow: 0 0 35px rgba(244, 114, 182, 0.35);
      transition: box-shadow 0.25s ease, transform 0.25s ease;
    }
    .avatar-stage.talking {
      box-shadow: 0 0 48px rgba(244, 114, 182, 0.8), 0 0 20px rgba(168, 85, 247, 0.6);
      transform: scale(1.03);
    }
    .avatar-svg {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(180deg, #fff1f2 0%, #ffe4e6 100%);
      overflow: visible;
    }
    .eye-lid {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 4.2s infinite;
    }
    @keyframes blink {
      0%, 94%, 100% { transform: scaleY(1); }
      97% { transform: scaleY(0.08); }
    }
    .mouth-shape {
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 0.12s ease;
    }
    .avatar-stage.talking .mouth-shape {
      animation: talkMouth 0.26s infinite alternate ease-in-out;
    }
    @keyframes talkMouth {
      0% { transform: scaleY(0.55) scaleX(1.05); }
      100% { transform: scaleY(1.45) scaleX(0.92); }
    }
    .speech {
      width: 100%;
      min-height: 115px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 15px 16px;
      line-height: 1.55;
      font-size: 15px;
    }
    .speech.speaking {
      border-color: #f472b6;
    }
    .speech small {
      display: block;
      margin-top: 8px;
      color: #94a3b8;
      font-size: 12.5px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="panel">
      <video id="cameraVideo" playsinline muted></video>
      <div id="cameraStatus">Klik tombol untuk mengaktifkan kamera & AI</div>
      <button id="cameraBtn">AKTIFKAN KAMERA</button>
    </div>

    <div class="panel">
      <div class="avatar-stage" aria-hidden="true">
        <svg class="avatar-svg" viewBox="0 0 200 200">
          <!-- Rambut belakang -->
          <path d="M42 92 C40 42, 160 42, 158 92 L168 175 C140 184, 60 184, 32 175 Z" fill="#3b1d2a" />
          <!-- Leher & bahu -->
          <rect x="84" y="126" width="32" height="30" rx="12" fill="#f7c8b8" />
          <path d="M45 195 C50 156, 150 156, 155 195 Z" fill="#ec4899" />
          <path d="M80 152 L100 170 L120 152 Z" fill="#fff1f2" />
          <!-- Wajah -->
          <ellipse cx="100" cy="98" rx="44" ry="50" fill="#fbd3c4" />
          <!-- Pipi merona -->
          <ellipse cx="70" cy="110" rx="9" ry="5.5" fill="#fb7185" opacity="0.35" />
          <ellipse cx="130" cy="110" rx="9" ry="5.5" fill="#fb7185" opacity="0.35" />
          <!-- Alis -->
          <path d="M65 80 Q76 74 87 80" stroke="#3b1d2a" stroke-width="3" fill="none" stroke-linecap="round" />
          <path d="M113 80 Q124 74 135 80" stroke="#3b1d2a" stroke-width="3" fill="none" stroke-linecap="round" />
          <!-- Mata -->
          <g class="eye-lid">
            <circle cx="76" cy="94" r="6.5" fill="#1e1b4b" />
            <circle cx="78" cy="92" r="2.2" fill="#ffffff" />
            <circle cx="124" cy="94" r="6.5" fill="#1e1b4b" />
            <circle cx="126" cy="92" r="2.2" fill="#ffffff" />
          </g>
          <!-- Hidung -->
          <path d="M100 96 L98 107 L103 108" stroke="#d99b88" stroke-width="2.4" fill="none" stroke-linecap="round" />
          <!-- Mulut -->
          <ellipse class="mouth-shape" cx="100" cy="121" rx="11" ry="5.5" fill="#e11d48" />
          <!-- Poni depan -->
          <path d="M56 88 C62 54, 138 54, 144 88 C128 73, 110 71, 96 84 C82 70, 68 74, 56 88 Z" fill="#4a2535" />
        </svg>
      </div>

      <div class="speech">
        Halo! Saya <b>Naya</b>, asisten resepsionis Anda. Klik <b>Aktifkan Kamera</b> untuk mulai menyapa.
        <small>Siap berdialog dua arah</small>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      FaceDetector,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const GEMINI_API_KEY = "AQ.Ab8RN6Jn8FjR57KqSXL56zZ-xQtSwLHX4w0s-kJ8w6WdlAZgBg";
    const SYSTEM_PROMPT =
      "Kamu adalah Naya, asisten resepsionis wanita yang ramah, hangat, sopan, dan membantu. " +
      "Jawab dalam bahasa Indonesia yang natural dan singkat (maksimal 2-3 kalimat). " +
      "Jangan gunakan simbol aneh, emoji, atau format markdown karena teks akan dibacakan lewat suara.";

    const video = document.getElementById("cameraVideo");
    const cameraBtn = document.getElementById("cameraBtn");
    const cameraStatus = document.getElementById("cameraStatus");
    const avatar = document.querySelector(".avatar-stage");
    const speechBox = document.querySelector(".speech");

    let detector = null;
    let cameraStream = null;
    let greeted = false;
    let absentFrames = 0;
    let isSpeaking = false;
    let isListening = false;
    let recognition = null;
    let chatHistory = [];

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "id-ID";
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        cameraStatus.textContent = "🎤 Silakan berbicara...";
      };

      recognition.onresult = async (event) => {
        const userText = event.results[0][0].transcript;
        speechBox.innerHTML = `🗣️ <i>"${userText}"</i><small>Naya sedang berpikir...</small>`;
        await processConversation(userText);
      };

      recognition.onerror = (event) => {
        isListening = false;
        if (event.error === "no-speech" && greeted && !isSpeaking) {
          setTimeout(startListening, 500);
        } else {
          cameraStatus.textContent = "🟢 Pengunjung terdeteksi";
        }
      };

      recognition.onend = () => {
        isListening = false;
      };
    }

    function speak(message, listenAfter = true) {
      if (!("speechSynthesis" in window)) return;
      stopListening();
      speechSynthesis.cancel();

      isSpeaking = true;
      speechBox.classList.add("speaking");
      avatar.classList.add("talking");
      speechBox.innerHTML = `✨ ${message}<small>Naya mendengarkan Anda...</small>`;

      const utterance = new SpeechSynthesisUtterance(message);
      utterance.lang = "id-ID";
      utterance.rate = 1.0;
      utterance.pitch = 1.15;

      utterance.onend = () => {
        isSpeaking = false;
        avatar.classList.remove("talking");
        speechBox.classList.remove("speaking");
        if (listenAfter && greeted) startListening();
      };

      utterance.onerror = () => {
        isSpeaking = false;
        avatar.classList.remove("talking");
        speechBox.classList.remove("speaking");
      };

      speechSynthesis.speak(utterance);
    }

    function startListening() {
      if (!recognition || isListening || isSpeaking || !greeted) return;
      try {
        recognition.start();
      } catch (e) {
        console.warn("Mic sudah aktif:", e);
      }
    }

    function stopListening() {
      if (recognition && isListening) {
        try {
          recognition.stop();
        } catch (e) {}
      }
      isListening = false;
    }

    async function processConversation(userText) {
      cameraStatus.textContent = "🧠 Naya sedang menyiapkan jawaban...";
      chatHistory.push({ role: "user", parts: [{ text: userText }] });

      try {
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${AQ.Ab8RN6Jn8FjR57KqSXL56zZ-xQtSwLHX4w0s-kJ8w6WdlAZgBg}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
              contents: chatHistory
            })
          }
        );

        const data = await response.json();
        const aiReply =
          data.candidates?.[0]?.content?.parts?.[0]?.text ||
          "Maaf, bisa tolong ulangi pertanyaan Anda?";

        chatHistory.push({ role: "model", parts: [{ text: aiReply }] });
        speak(aiReply, true);
      } catch (error) {
        console.error("Error AI:", error);
        speak("Maaf, koneksi saya sedang terganggu. Ada lagi yang bisa saya bantu?", true);
      }
    }

    async function startCamera() {
      try {
        cameraStatus.textContent = "Meminta izin kamera...";
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: 640, height: 480 },
          audio: false
        });

        video.srcObject = cameraStream;
        await video.play();

        cameraStatus.textContent = "Memuat AI Face Detection...";
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );

        detector = await FaceDetector.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/latest/blaze_face_short_range.tflite"
          },
          runningMode: "VIDEO",
          minDetectionConfidence: 0.6
        });

        cameraStatus.textContent = "🟢 AI AKTIF - Menunggu pengunjung...";
        cameraBtn.textContent = "KAMERA AKTIF";
        detectFace();
      } catch (error) {
        console.error(error);
        cameraStatus.textContent = "Kamera gagal diaktifkan. Periksa izin kamera.";
      }
    }

    function detectFace() {
      if (!detector || video.readyState < 2) {
        requestAnimationFrame(detectFace);
        return;
      }

      const result = detector.detectForVideo(video, performance.now());
      const foundFace = result.detections.length > 0;

      if (foundFace) {
        absentFrames = 0;
        if (!greeted) {
          greeted = true;
          chatHistory = [];
          const greetingText = "Halo! Selamat datang. Saya Naya, ada yang bisa saya bantu hari ini?";
          chatHistory.push({ role: "model", parts: [{ text: greetingText }] });
          speak(greetingText, true);
        }
      } else {
        absentFrames++;
        if (absentFrames > 90 && greeted) {
          greeted = false;
          chatHistory = [];
          stopListening();
          speechSynthesis.cancel();
          cameraStatus.textContent = "🔵 Menunggu pengunjung...";
          speechBox.innerHTML = "Halo! Saya <b>Naya</b>, siap menyapa pengunjung berikutnya.<small>Menunggu di depan kamera</small>";
        }
      }

      requestAnimationFrame(detectFace);
    }

    cameraBtn.addEventListener("click", startCamera);
  </script>
</body>
</html>

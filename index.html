<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Customer Service</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at top left, #3b82f6, transparent 35%),
    linear-gradient(135deg, #0f172a, #1e293b);
  color: #fff;
  min-height: 100vh;
}


/* =========================
   HEADER
========================= */

.header {
  height: 75px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 35px;
  background: rgba(15,23,42,.75);
  border-bottom: 1px solid rgba(255,255,255,.1);
}

.logo {
  font-size: 22px;
  font-weight: bold;
}

.online {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
}

.dot {
  width: 10px;
  height: 10px;
  background: #22c55e;
  border-radius: 50%;
  box-shadow: 0 0 12px #22c55e;
}


/* =========================
   MAIN
========================= */

.main {
  height: calc(100vh - 75px);
  display: grid;
  grid-template-columns: 55% 45%;
}


/* =========================
   AVATAR
========================= */

.avatar-area {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  position: relative;
}

.avatar-container {
  width: 360px;
  height: 360px;
  border-radius: 50%;
  background:
    radial-gradient(circle, #60a5fa 0%, #2563eb 45%, #1d4ed8 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow:
    0 0 50px rgba(59,130,246,.5),
    inset 0 0 40px rgba(255,255,255,.15);
  transition: .3s;
}

.avatar-container.listening {
  animation: listening 1s infinite;
}

.avatar-container.speaking {
  animation: speaking .5s infinite alternate;
}


/* AVATAR SVG */

.avatar {
  width: 280px;
  height: 280px;
}


/* AVATAR MULUT */

.mouth {
  transform-origin: center;
}

.speaking .mouth {
  animation: mouth 0.25s infinite alternate;
}


/* =========================
   AVATAR INFO
========================= */

.avatar-name {
  margin-top: 25px;
  font-size: 25px;
  font-weight: bold;
}

.avatar-status {
  margin-top: 8px;
  color: #cbd5e1;
  font-size: 15px;
}


/* =========================
   CHAT
========================= */

.chat-area {
  display: flex;
  flex-direction: column;
  padding: 30px;
  background: rgba(15,23,42,.55);
  border-left: 1px solid rgba(255,255,255,.1);
}

.chat-title {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 20px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding-right: 10px;
}

.message {
  padding: 14px 18px;
  margin-bottom: 15px;
  border-radius: 18px;
  max-width: 85%;
  line-height: 1.5;
  white-space: pre-line;
}

.bot {
  background: #334155;
  border-bottom-left-radius: 5px;
}

.user {
  background: #2563eb;
  margin-left: auto;
  border-bottom-right-radius: 5px;
}


/* =========================
   INPUT
========================= */

.input-area {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

#textInput {
  flex: 1;
  padding: 16px;
  border: none;
  outline: none;
  border-radius: 15px;
  background: #334155;
  color: white;
  font-size: 15px;
}

#textInput::placeholder {
  color: #94a3b8;
}

#send {
  padding: 0 22px;
  border: none;
  border-radius: 15px;
  background: #2563eb;
  color: white;
  cursor: pointer;
  font-size: 15px;
}


/* =========================
   MIC
========================= */

.mic-area {
  text-align: center;
  margin-top: 15px;
}

#mic {
  width: 70px;
  height: 70px;
  border: none;
  border-radius: 50%;
  background: #2563eb;
  color: white;
  font-size: 30px;
  cursor: pointer;
  transition: .2s;
}

#mic:hover {
  transform: scale(1.08);
}

#mic.active {
  background: #dc2626;
  animation: pulse 1s infinite;
}

#status {
  margin-top: 10px;
  color: #94a3b8;
  font-size: 13px;
}


/* =========================
   ANIMATION
========================= */

@keyframes pulse {

  0% {
    box-shadow: 0 0 0 0 rgba(220,38,38,.6);
  }

  70% {
    box-shadow: 0 0 0 20px rgba(220,38,38,0);
  }

  100% {
    box-shadow: 0 0 0 0 rgba(220,38,38,0);
  }

}

@keyframes listening {

  0% {
    box-shadow: 0 0 30px #3b82f6;
  }

  50% {
    box-shadow: 0 0 80px #60a5fa;
  }

  100% {
    box-shadow: 0 0 30px #3b82f6;
  }

}

@keyframes speaking {

  from {
    transform: scale(1);
  }

  to {
    transform: scale(1.04);
  }

}

@keyframes mouth {

  from {
    transform: scaleY(1);
  }

  to {
    transform: scaleY(.35);
  }

}


/* =========================
   RESPONSIVE
========================= */

@media(max-width: 900px) {

  .main {
    grid-template-columns: 1fr;
    height: auto;
  }

  .avatar-area {
    padding: 40px 20px;
  }

  .avatar-container {
    width: 250px;
    height: 250px;
  }

  .avatar {
    width: 200px;
    height: 200px;
  }

  .chat-area {
    height: 600px;
    border-left: none;
    border-top: 1px solid rgba(255,255,255,.1);
  }

}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

  <div class="logo">
    🤖 AI Customer Service
  </div>

  <div class="online">
    <span class="dot"></span>
    Online
  </div>

</header>



<!-- =========================
     MAIN
========================= -->

<main class="main">


  <!-- =======================
       AVATAR
  ======================== -->

  <section class="avatar-area">

    <div
      id="avatarContainer"
      class="avatar-container"
    >

      <!-- AVATAR SVG -->

      <svg
        class="avatar"
        viewBox="0 0 300 300"
        xmlns="http://www.w3.org/2000/svg"
      >

        <!-- rambut -->

        <path
          d="M70 130
             C65 60 105 25 150 25
             C205 25 235 70 230 135
             L210 115
             C205 70 180 55 150 55
             C115 55 90 80 85 120Z"
          fill="#3b2416"
        />

        <!-- kepala -->

        <ellipse
          cx="150"
          cy="145"
          rx="78"
          ry="90"
          fill="#f4c7a1"
        />

        <!-- rambut depan -->

        <path
          d="M75 115
             C70 55 110 35 150 35
             C195 35 225 70 220 115
             C195 85 180 75 160 80
             C135 90 105 75 75 115Z"
          fill="#432818"
        />

        <!-- mata -->

        <ellipse
          cx="120"
          cy="145"
          rx="8"
          ry="10"
          fill="#1e293b"
        />

        <ellipse
          cx="180"
          cy="145"
          rx="8"
          ry="10"
          fill="#1e293b"
        />

        <!-- hidung -->

        <path
          d="M150 150 L143 170 L155 170"
          fill="none"
          stroke="#c08457"
          stroke-width="4"
          stroke-linecap="round"
        />

        <!-- mulut -->

        <ellipse
          id="mouth"
          class="mouth"
          cx="150"
          cy="195"
          rx="22"
          ry="7"
          fill="#7f1d1d"
        />

        <!-- baju -->

        <path
          d="M90 235
             C110 215 190 215 210 235
             L235 300
             L65 300Z"
          fill="#2563eb"
        />

        <!-- kerah -->

        <path
          d="M120 230 L150 265 L180 230"
          fill="white"
        />

      </svg>

    </div>


    <div class="avatar-name">
      Sarah
    </div>

    <div
      id="avatarStatus"
      class="avatar-status"
    >
      Siap membantu Anda
    </div>

  </section>



  <!-- =======================
       CHAT
  ======================== -->

  <section class="chat-area">

    <div class="chat-title">
      💬 Percakapan
    </div>


    <div id="chat">

      <div class="message bot">
        Halo 👋 Saya Sarah, Customer Service Anda.
        
        Silakan tanyakan tentang produk, harga,
        alamat, jam operasional, pengiriman,
        atau layanan kami.
      </div>

    </div>


    <div class="input-area">

      <input
        id="textInput"
        type="text"
        placeholder="Tulis pertanyaan..."
      >

      <button id="send">
        Kirim
      </button>

    </div>


    <div class="mic-area">

      <button id="mic">
        🎤
      </button>

      <div id="status">
        Tekan mikrofon untuk berbicara
      </div>

    </div>

  </section>

</main>



<script>


/*
==================================================
 DATA CUSTOMER SERVICE
==================================================

UBAH DATA DI SINI.
==================================================
*/


const DATA = {

  perusahaan: {

    nama: "Toko ABC",

    alamat:
      "Jl. Contoh No. 123, Denpasar, Bali",

    telepon:
      "08123456789",

    email:
      "customer@tokoabc.com",

    jam:
      "Senin sampai Sabtu, pukul 08.00 sampai 17.00"

  },


  produk: [

    {
      nama: "Produk A",

      harga: "Rp100.000",

      deskripsi:
        "Produk berkualitas untuk kebutuhan sehari-hari.",

      stok:
        "Tersedia"

    },

    {
      nama: "Produk B",

      harga: "Rp150.000",

      deskripsi:
        "Produk premium dengan kualitas terbaik.",

      stok:
        "Tersedia"

    },

    {
      nama: "Produk C",

      harga: "Rp200.000",

      deskripsi:
        "Produk pilihan untuk kebutuhan keluarga.",

      stok:
        "Habis"

    }

  ],


  faq: [

    {
      kata: [
        "cara",
        "pesan"
      ],

      jawaban:
        "Untuk melakukan pemesanan, silakan pilih produk dan hubungi customer service kami."
    },

    {
      kata: [
        "cara",
        "bayar"
      ],

      jawaban:
        "Kami menerima pembayaran melalui transfer bank dan pembayaran digital."
    },

    {
      kata: [
        "pengiriman"
      ],

      jawaban:
        "Kami melayani pengiriman ke berbagai wilayah. Lama pengiriman tergantung lokasi tujuan."
    },

    {
      kata: [
        "refund"
      ],

      jawaban:
        "Untuk pengajuan refund, silakan hubungi customer service kami."
    }

  ]

};



/*
==================================================
 ELEMENT
==================================================
*/

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("textInput");

const send =
  document.getElementById("send");

const mic =
  document.getElementById("mic");

const status =
  document.getElementById("status");

const avatarContainer =
  document.getElementById("avatarContainer");

const avatarStatus =
  document.getElementById("avatarStatus");



/*
==================================================
 CHAT
==================================================
*/

function addMessage(text, type) {

  const div =
    document.createElement("div");

  div.className =
    "message " + type;

  div.innerText =
    text;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;

}



/*
==================================================
 JAWAB PERTANYAAN
==================================================
*/

function jawab(question) {

  const q =
    question.toLowerCase();


  // SALAM

  if (
    q.includes("halo") ||
    q.includes("hai") ||
    q.includes("hello")
  ) {

    return `Halo 👋 Selamat datang di ${DATA.perusahaan.nama}. Ada yang bisa saya bantu?`;

  }


  // ALAMAT

  if (
    q.includes("alamat") ||
    q.includes("lokasi") ||
    q.includes("dimana") ||
    q.includes("di mana")
  ) {

    return `Alamat kami adalah ${DATA.perusahaan.alamat}.`;

  }


  // TELEPON

  if (
    q.includes("telepon") ||
    q.includes("nomor") ||
    q.includes("whatsapp") ||
    q.includes("wa")
  ) {

    return `Nomor customer service kami adalah ${DATA.perusahaan.telepon}.`;

  }


  // EMAIL

  if (q.includes("email")) {

    return `Email kami adalah ${DATA.perusahaan.email}.`;

  }


  // JAM

  if (
    q.includes("jam") ||
    q.includes("buka") ||
    q.includes("tutup") ||
    q.includes("operasional")
  ) {

    return `Jam operasional kami adalah ${DATA.perusahaan.jam}.`;

  }


  // PRODUK

  for (const produk of DATA.produk) {

    const nama =
      produk.nama.toLowerCase();


    if (q.includes(nama)) {

      if (
        q.includes("harga") ||
        q.includes("berapa")
      ) {

        return `${produk.nama} harganya ${produk.harga}.`;

      }


      if (
        q.includes("stok") ||
        q.includes("ada") ||
        q.includes("tersedia")
      ) {

        return `Untuk ${produk.nama}, stok saat ini ${produk.stok}.`;

      }


      return `${produk.nama}: ${produk.deskripsi} Harganya ${produk.harga}. Stok ${produk.stok}.`;

    }

  }


  // HARGA

  if (
    q.includes("harga") ||
    q.includes("berapa")
  ) {

    let hasil =
      "Berikut daftar harga produk kami:\n\n";


    DATA.produk.forEach(p => {

      hasil +=
        `${p.nama}: ${p.harga}\n`;

    });


    return hasil;

  }


  // FAQ

  for (const faq of DATA.faq) {

    let jumlah =
      0;


    faq.kata.forEach(kata => {

      if (q.includes(kata)) {

        jumlah++;

      }

    });


    if (
      jumlah >=
      Math.ceil(faq.kata.length / 2)
    ) {

      return faq.jawaban;

    }

  }


  // TERIMA KASIH

  if (
    q.includes("terima kasih") ||
    q.includes("makasih")
  ) {

    return "Sama-sama 😊 Senang bisa membantu Anda.";

  }


  // DEFAULT

  return `
Maaf, saya belum menemukan informasi tersebut.

Anda dapat menanyakan:
• Harga produk
• Stok produk
• Alamat
• Jam operasional
• Nomor telepon
• Email
• Cara pemesanan
• Pembayaran
• Pengiriman
• Refund
`;

}



/*
==================================================
 PROSES PERTANYAAN
==================================================
*/

function proses(text) {

  if (!text.trim()) {

    return;

  }


  addMessage(
    text,
    "user"
  );


  status.innerText =
    "Sarah sedang berpikir...";


  avatarStatus.innerText =
    "Sedang menjawab...";


  avatarContainer.classList.add(
    "speaking"
  );


  setTimeout(() => {

    const answer =
      jawab(text);


    addMessage(
      answer,
      "bot"
    );


    speak(answer);

  }, 500);

}



/*
==================================================
 TEXT INPUT
==================================================
*/

send.onclick = () => {

  const text =
    input.value;


  input.value = "";


  proses(text);

};


input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      send.click();

    }

  }
);



/*
==================================================
 VOICE RECOGNITION
==================================================
*/

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  const recognition =
    new SpeechRecognition();


  recognition.lang =
    "id-ID";


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  mic.onclick = () => {

    try {

      recognition.start();

      mic.classList.add(
        "active"
      );

      mic.innerHTML =
        "🔴";


      status.innerText =
        "Mendengarkan...";


      avatarStatus.innerText =
        "Saya sedang mendengarkan...";


      avatarContainer.classList.add(
        "listening"
      );

    }

    catch(error) {

      console.log(error);

    }

  };


  recognition.onresult =
    event => {

      const text =
        event.results[0][0].transcript;


      mic.classList.remove(
        "active"
      );


      mic.innerHTML =
        "🎤";


      avatarContainer.classList.remove(
        "listening"
      );


      proses(text);

    };


  recognition.onend =
    () => {

      mic.classList.remove(
        "active"
      );

      mic.innerHTML =
        "🎤";


      avatarContainer.classList.remove(
        "listening"
      );

    };


  recognition.onerror =
    event => {

      console.log(
        event.error
      );


      mic.classList.remove(
        "active"
      );


      mic.innerHTML =
        "🎤";


      avatarContainer.classList.remove(
        "listening"
      );


      status.innerText =
        "Tidak terdengar. Silakan coba lagi.";

      avatarStatus.innerText =
        "Siap membantu Anda";

    };

}



/*
==================================================
 TEXT TO SPEECH
==================================================
*/

function speak(text) {

  speechSynthesis.cancel();


  const voice =
    new SpeechSynthesisUtterance(
      text
    );


  voice.lang =
    "id-ID";


  voice.rate =
    0.95;


  voice.pitch =
    1;


  avatarContainer.classList.add(
    "speaking"
  );


  avatarStatus.innerText =
    "Sarah sedang berbicara...";


  voice.onend =
    () => {

      avatarContainer.classList.remove(
        "speaking"
      );


      avatarStatus.innerText =
        "Siap membantu Anda";


      status.innerText =
        "Tekan mikrofon untuk berbicara lagi";

    };


  speechSynthesis.speak(
    voice
  );

}


</script>

</body>
</html>

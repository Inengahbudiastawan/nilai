<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avatar Resepsionis AI</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 20px;
    }
    .container {
      width: 100%;
      max-width: 820px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 680px) {
      .container { grid-template-columns: 1fr; }
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    video {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 12px;
      background: #020617;
      transform: scaleX(-1);
    }
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .avatar.talking {
      transform: scale(1.08);
      box-shadow: 0 0 28px rgba(56, 189, 248, 0.75);
      animation: pulse 0.6s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1.03); }
      to { transform: scale(1.12); }
    }
    .speech {
      width: 100%;
      min-height: 110px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      line-height: 1.5;
      font-size: 15px;
    }
    .speech.speaking { border-color: #38bdf8; }
    .speech small { display: block; margin-top: 8px; color: #94a3b8; }
    #cameraStatus { font-size: 14px; color: #cbd5e1; text-align: center; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <video id="cameraVideo" playsinline muted></video>
      <div id="cameraStatus">Menunggu diaktifkan...</div>
      <button id="cameraBtn">AKTIFKAN KAMERA</button>
    </div>

    <div class="card">
      <div class="avatar" aria-hidden="true">🤖</div>
      <div class="speech">Halo! Klik <b>Aktifkan Kamera</b> untuk memulai.<small>Siap menyapa pelanggan</small></div>
    </div>
  </div>

  <script type="module">
    import {
      FaceDetector,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const GEMINI_API_KEY = "MASUKKAN_API_KEY_GEMINI_ANDA";
    const SYSTEM_PROMPT =
      "Kamu adalah asisten resepsionis AI yang ramah, sopan, dan membantu. " +
      "Jawab dalam bahasa Indonesia yang natural dan singkat (maksimal 2-3 kalimat). " +
      "Jangan gunakan simbol aneh, emoji, atau format markdown karena teks akan dibacakan lewat suara.";

    const video = document.getElementById("cameraVideo");
    const cameraBtn = document.getElementById("cameraBtn");
    const cameraStatus = document.getElementById("cameraStatus");
    const avatar = document.querySelector(".avatar");
    const speechBox = document.querySelector(".speech");

    let detector = null;
    let cameraStream = null;
    let greeted = false;
    let absentFrames = 0;
    let isSpeaking = false;
    let isListening = false;
    let recognition = null;
    let chatHistory = [];

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "id-ID";
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        cameraStatus.textContent = "🎤 Silakan berbicara...";
      };

      recognition.onresult = async (event) => {
        const userText = event.results[0][0].transcript;
        speechBox.innerHTML = `🗣️ <i>"${userText}"</i><small>Sedang berpikir...</small>`;
        await processConversation(userText);
      };

      recognition.onerror = (event) => {
        isListening = false;
        if (event.error === "no-speech" && greeted && !isSpeaking) {
          setTimeout(startListening, 500);
        } else {
          cameraStatus.textContent = "🟢 Pelanggan terdeteksi";
        }
      };

      recognition.onend = () => {
        isListening = false;
      };
    }

    function speak(message, listenAfter = true) {
      if (!("speechSynthesis" in window)) return;
      stopListening();
      speechSynthesis.cancel();

      isSpeaking = true;
      speechBox.classList.add("speaking");
      avatar.classList.add("talking");
      speechBox.innerHTML = `🤖 ${message}<small>Saya mendengarkan Anda...</small>`;

      const utterance = new SpeechSynthesisUtterance(message);
      utterance.lang = "id-ID";
      utterance.rate = 1.0;
      utterance.pitch = 1.05;

      utterance.onend = () => {
        isSpeaking = false;
        avatar.classList.remove("talking");
        speechBox.classList.remove("speaking");
        if (listenAfter && greeted) startListening();
      };

      utterance.onerror = () => {
        isSpeaking = false;
        avatar.classList.remove("talking");
        speechBox.classList.remove("speaking");
      };

      speechSynthesis.speak(utterance);
    }

    function startListening() {
      if (!recognition || isListening || isSpeaking || !greeted) return;
      try {
        recognition.start();
      } catch (e) {
        console.warn("Mic sudah aktif:", e);
      }
    }

    function stopListening() {
      if (recognition && isListening) {
        try {
          recognition.stop();
        } catch (e) {}
      }
      isListening = false;
    }

    async function processConversation(userText) {
      cameraStatus.textContent = "🧠 AI sedang memproses jawaban...";
      chatHistory.push({ role: "user", parts: [{ text: userText }] });

      try {
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
              contents: chatHistory
            })
          }
        );

        const data = await response.json();
        const aiReply =
          data.candidates?.[0]?.content?.parts?.[0]?.text ||
          "Maaf, bisa tolong ulangi pertanyaan Anda?";

        chatHistory.push({ role: "model", parts: [{ text: aiReply }] });
        speak(aiReply, true);
      } catch (error) {
        console.error("Error AI:", error);
        speak("Maaf, koneksi saya sedang terganggu. Ada lagi yang bisa dibantu?", true);
      }
    }

    async function startCamera() {
      try {
        cameraStatus.textContent = "Meminta izin kamera...";
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: 640, height: 480 },
          audio: false
        });

        video.srcObject = cameraStream;
        await video.play();

        cameraStatus.textContent = "Memuat AI Face Detection...";
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );

        detector = await FaceDetector.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/latest/blaze_face_short_range.tflite"
          },
          runningMode: "VIDEO",
          minDetectionConfidence: 0.6
        });

        cameraStatus.textContent = "🟢 AI AKTIF - Menunggu pelanggan...";
        cameraBtn.textContent = "KAMERA AKTIF";
        detectFace();
      } catch (error) {
        console.error(error);
        cameraStatus.textContent = "Kamera gagal diaktifkan. Periksa izin kamera.";
      }
    }

    function detectFace() {
      if (!detector || video.readyState < 2) {
        requestAnimationFrame(detectFace);
        return;
      }

      const result = detector.detectForVideo(video, performance.now());
      const foundFace = result.detections.length > 0;

      if (foundFace) {
        absentFrames = 0;
        if (!greeted) {
          greeted = true;
          chatHistory = [];
          const greetingText = "Halo! Selamat datang. Ada yang bisa saya bantu hari ini?";
          chatHistory.push({ role: "model", parts: [{ text: greetingText }] });
          speak(greetingText, true);
        }
      } else {
        absentFrames++;
        if (absentFrames > 90 && greeted) {
          greeted = false;
          chatHistory = [];
          stopListening();
          speechSynthesis.cancel();
          cameraStatus.textContent = "🔵 Menunggu pelanggan...";
          speechBox.innerHTML = "🤖 Menunggu kedatangan pelanggan...";
        }
      }

      requestAnimationFrame(detectFace);
    }

    cameraBtn.addEventListener("click", startCamera);
  </script>
</body>
</html>

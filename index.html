
<script type="module">
import {
    FaceDetector,
    FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById("cameraVideo");
const cameraBtn = document.getElementById("cameraBtn");
const cameraStatus = document.getElementById("cameraStatus");

const avatar = document.querySelector(".avatar");
const speechBox = document.querySelector(".speech");

let detector = null;
let cameraStream = null;
let greeted = false;
let absentFrames = 0;
let recognizing = false;
let lastGreeting = 0;

function speak(message) {
    if (!("speechSynthesis" in window)) return;

    speechSynthesis.cancel();

    speechBox.classList.add("speaking");
    avatar.classList.add("talking");

    speechBox.innerHTML =
        "🤖 " + message +
        "<small>Senang bisa bertemu dengan Anda ❤️</small>";

    const utterance = new SpeechSynthesisUtterance(message);

    utterance.lang = "id-ID";
    utterance.rate = 0.95;
    utterance.pitch = 1.1;
    utterance.volume = 1;

    utterance.onend = () => {
        avatar.classList.remove("talking");
        speechBox.classList.remove("speaking");
    };

    utterance.onerror = () => {
        avatar.classList.remove("talking");
        speechBox.classList.remove("speaking");
    };

    speechSynthesis.speak(utterance);
}

async function startCamera() {
    try {
        cameraStatus.textContent = "Meminta izin kamera...";

        cameraStream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user",
                width: 640,
                height: 480
            },
            audio: false
        });

        video.srcObject = cameraStream;
        await video.play();

        cameraStatus.textContent = "Memuat AI Face Detection...";

        const vision = await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );

        detector = await FaceDetector.createFromOptions(
            vision,
            {
                baseOptions: {
                    modelAssetPath:
                    "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/latest/blaze_face_short_range.tflite"
                },
                runningMode: "VIDEO",
                minDetectionConfidence: 0.6
            }
        );

        cameraStatus.textContent =
            "🟢 AI AKTIF - Menunggu pelanggan...";

        cameraBtn.textContent = "KAMERA AKTIF";

        detectFace();

    } catch (error) {
        console.error(error);

        cameraStatus.textContent =
            "Kamera gagal diaktifkan. Periksa izin kamera.";

        if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
            cameraStream = null;
        }
    }
}

function detectFace() {
    if (!detector || video.readyState < 2) {
        requestAnimationFrame(detectFace);
        return;
    }

    const now = performance.now();

    const result = detector.detectForVideo(video, now);

    const foundFace = result.detections.length > 0;

    if (foundFace) {
        absentFrames = 0;

        cameraStatus.textContent =
            "🟢 Pelanggan terdeteksi!";

        if (!greeted && Date.now() - lastGreeting > 3000) {
            greeted = true;
            lastGreeting = Date.now();

            speak(
                "Halo! Selamat datang. " +
                "Terima kasih sudah berkunjung ke tempat kami. " +
                "Semoga hari Anda menyenangkan!"
            );

            setTimeout(startListening, 5000);
        }

    } else {
        absentFrames++;

        cameraStatus.textContent =
            "🔵 Menunggu pelanggan...";

        // Reset setelah wajah tidak terlihat selama beberapa detik
        if (absentFrames > 30) {
            greeted = false;
        }
    }

    requestAnimationFrame(detectFace);
}

// DIALOG SUARA PELANGGAN

function startListening() {
    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition || recognizing) return;
    if (!greeted) return;

    const recognition = new SpeechRecognition();

    recognition.lang = "id-ID";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognizing = true;

    cameraStatus.textContent =
        "🎤 Silakan berbicara...";

    recognition.onresult = (event) => {
        const answer =
            event.results[0][0].transcript.toLowerCase();

        respondToCustomer(answer);
    };

    recognition.onerror = () => {
        cameraStatus.textContent =
            "AI siap mendeteksi pelanggan.";
    };

    recognition.onend = () => {
        recognizing = false;
    };

    try {
        recognition.start();
    } catch (error) {
        recognizing = false;
    }
}

function respondToCustomer(answer) {
    let response;

    if (
        answer.includes("terima kasih") ||
        answer.includes("makasih")
    ) {
        response =
            "Sama-sama! Senang sekali bisa membantu Anda.";
    }

    else if (
        answer.includes("baik") ||
        answer.includes("sehat")
    ) {
        response =
            "Wah, senang mendengarnya! Semoga selalu sehat.";
    }

    else if (
        answer.includes("halo") ||
        answer.includes("hai") ||
        answer.includes("hi")
    ) {
        response =
            "Halo juga! Senang bertemu dengan Anda.";
    }

    else if (
        answer.includes("review") ||
        answer.includes("ulasan")
    ) {
        response =
            "Terima kasih! Jika berkenan, Anda bisa memberikan ulasan melalui QR Code di samping kami.";
    }

    else {
        response =
            "Terima kasih sudah berbicara dengan saya. " +
            "Semoga kunjungan Anda menyenangkan!";
    }

    speak(response);

    // Dengarkan lagi setelah avatar selesai berbicara
    setTimeout(() => {
        if (greeted) startListening();
    }, 3500);
}

cameraBtn.addEventListener("click", startCamera);

</script>
